# Publica el feed cada dos días, sin nadie mirando.
#
# El pipeline corre igual en una máquina de desarrollo; esto solo se encarga de
# que ocurra sin que haya que acordarse. Lo que sí cambia al correr acá es que
# nadie lee la salida antes de que se publique, y de eso se ocupan las dos
# revisiones del final: la que el propio pipeline hace antes de escribir el
# archivo, y `verificar_privacidad.py` antes de commitearlo.
#
# Se encendió por etapas, y ya está en la última:
#
#   1. --dias 4 --sin-llm                       entró al buzón y reportó, sin escribir
#   2. --dias 4 --publicar --marcar --simular   escribió el feed; el buzón, solo en plan
#   3. --dias 4 --publicar --marcar             completo  ← acá estamos
#
# La etapa 2 estuvo puesta del 2 al 6 de setiembre y publicó dos feeds sin tocar
# un solo correo, que es lo que `--simular` promete. El costo no fue solo un
# buzón sucio: la etiqueta `PuzzleFeed/Procesado` es la memoria del pipeline, así
# que sin ella la ventana de cuatro días volvía a traer los mismos correos y el
# feed del 04 repitió trece piezas del anterior.

name: Publicar el feed

on:
  schedule:
    # 16:37 UTC, que en Costa Rica son las 10:37 de la mañana. Minuto raro a
    # propósito: la cola de tareas programadas se congestiona en las horas en
    # punto, y el disparo llega tarde de media hora a varias.
    #
    # Días pares. Cron no sabe decir "cada 48 horas", y esta es la forma más
    # cercana que no encadena dos corridas seguidas. El precio está en la vuelta
    # de mes, donde del 30 al 2 pasan tres días: por eso la ventana de búsqueda
    # es de cuatro días y no de dos, y el buzón absorbe la diferencia.
    - cron: '37 16 2-30/2 * *'

  # Para poder dispararlo a mano. Sin parámetros: lo que corre es siempre lo
  # mismo que corre solo.
  workflow_dispatch:

# Lo único que hace falta es escribir un archivo en el repositorio.
permissions:
  contents: write

# Dos corridas simultáneas etiquetarían los mismos correos dos veces.
concurrency:
  group: publicar-feed
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Medido el 07 de setiembre con `--dias 4`: dos corridas de 592 s y 714 s
    # SOLO en llamadas al modelo, con reintentos por congestión de Gemini. Los
    # cinco minutos de la medición vieja eran con `--dias 2`. Veinte minutos
    # dejaban muy poco margen, y agotarlos es el peor final posible: mata el
    # proceso a media escritura sobre el buzón. Treinta sigue cortando la llamada
    # que se cuelga esperando para siempre, que es para lo que está el límite.
    timeout-minutes: 30

    steps:
      # Las acciones van fijadas al identificador exacto del commit, no a una
      # etiqueta de versión. Una etiqueta es un puntero y se puede mover: lo que
      # corre acá tiene las credenciales del buzón cargadas, así que conviene
      # que sea exactamente el código que se revisó.
      - name: Traer el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Historial completo. Por defecto trae un solo commit, y sobre un clon
          # así de superficial el `git pull --rebase` del último paso no tiene
          # sobre qué reconstruir. El repositorio es chico: no cuesta nada.
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PUZZLE_SALT: ${{ secrets.PUZZLE_SALT }}
          PUZZLE_IDENTIFICADORES: ${{ secrets.PUZZLE_IDENTIFICADORES }}
        run: python pipeline/main.py --dias 4 --publicar --marcar

      - name: Revisar privacidad
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          PUZZLE_IDENTIFICADORES: ${{ secrets.PUZZLE_IDENTIFICADORES }}
        run: python verificar_privacidad.py

      - name: Publicar el feed
        run: |
          if git diff --quiet -- docs/feed.json; then
            echo "El feed no cambió: no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo este archivo, nombrado. Un `git add` que barra la carpeta
          # entera subiría cualquier cosa que un paso haya dejado escrita.
          git add docs/feed.json
          git commit -m "Feed del $(date -u +%Y-%m-%d)"
          # Para cuando se llega acá, los correos YA están etiquetados en Gmail, y
          # esa etiqueta es la memoria del pipeline: si el push se queda afuera,
          # ninguna corrida futura vuelve a mirar esos correos y sus noticias no
          # se publican nunca. Por eso se reintenta sobre lo que haya llegado al
          # repositorio mientras tanto, en vez de rendirse al primer rechazo.
          #
          # Si aun así falla, la corrida queda en rojo y se puede deshacer a mano:
          # los correos afectados son los que tengan `PuzzleFeed/Procesado` con
          # fecha de hoy, y quitarles la etiqueta los devuelve a la próxima ronda.
          git pull --rebase
          git push
